<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NOVA STORE{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo">
            NOVA<span>.</span>
        </a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'products' %}">Products</a>
            <a href="{% url 'cart' %}">Cart</a>
        </div>

        <a href="{% url 'products' %}" class="nav-button">
            Explore Store →
        </a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <h2>NOVA<span>.</span></h2>
        <p>Discover something extraordinary.</p>
        <p class="copyright">© 2026 NOVA STORE. All rights reserved.</p>
    </footer>

</body>
</html>
